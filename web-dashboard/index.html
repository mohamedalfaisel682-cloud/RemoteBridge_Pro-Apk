<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteBridge - لوحة المتابعة والتحكم المتقدمة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse" id="connection-indicator"></div>
            <h1 class="text-xl font-bold text-emerald-400">RemoteBridge <span class="text-xs text-slate-400 bg-slate-700 px-2 py-1 rounded">Enterprise L2</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="status-text" class="text-sm text-slate-300">غير متصل</span>
            <button onclick="connectWebSocket()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">اتصال بالجهاز</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- Sidebar Navigation -->
        <aside class="bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl p-4 flex flex-col gap-2 h-fit shadow-xl">
            <button onclick="switchTab('files')" class="tab-btn w-full text-right px-4 py-3 rounded-xl bg-emerald-600/20 text-emerald-400 font-medium transition flex items-center gap-3">📁 تصفح الملفات والقرص</button>
            <button onclick="switchTab('photos')" class="tab-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-700/50 text-slate-300 font-medium transition flex items-center gap-3">🖼️ معرض الصور</button>
            <button onclick="switchTab('notes')" class="tab-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-700/50 text-slate-300 font-medium transition flex items-center gap-3">📝 الملاحظات والرسائل</button>
            <button onclick="switchTab('system')" class="tab-btn w-full text-right px-4 py-3 rounded-xl hover:bg-slate-700/50 text-slate-300 font-medium transition flex items-center gap-3">⚙️ حالة الجهاز والبطارية</button>
        </aside>

        <!-- Display Panel -->
        <section class="md:col-span-3 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col">
            <div id="panel-content" class="flex-1">
                <h2 class="text-2xl font-bold mb-4 text-emerald-300">مرحباً بك في RemoteBridge Dashboard</h2>
                <p class="text-slate-400 leading-relaxed">قم بربط هاتفك القديم عبر إدخال معرّف الجهاز (Device ID) واضغط على اتصال للبدء في معاينة الملفات، الصور، والملاحظات بشكل آني وآمن عبر بروتوكول WebSocket المشفر.</p>
                
                <div class="mt-8 bg-slate-900/60 p-6 rounded-xl border border-slate-700/60 max-w-lg">
                    <label class="block text-sm font-medium text-slate-300 mb-2">معرّف الهاتف القديم المستهدف (Agent ID):</label>
                    <div class="flex gap-3">
                        <input type="text" id="agent-id-input" value="old-phone-01" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                        <button onclick="requestData('get_status')" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-medium transition">فحص الحالة</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let ws;
        const myID = "pc-controller-" + Math.floor(Math.random() * 10000);

        function connectWebSocket() {
            ws = new WebSocket("ws://localhost:8080/ws");

            ws.onopen = function() {
                document.getElementById("connection-indicator").classList.replace("bg-emerald-500", "bg-emerald-400");
                document.getElementById("status-textinnerText = "متصل بالخادم";
                
                // Register as controller
                ws.send(JSON.stringify({
                    type: "register",
                    target: "controller",
                    sender: myID,
                    payload: {}
                }));
                alert("تم الاتصال بنجاح بخادم التوجيه!");
            };

            ws.onmessage = function(event) {
                const msg = JSON.parse(event.data);
                console.log("Received:", msg);
                alert("استجابة من الجهاز: " + JSON.stringify(msg.payload));
            };

            ws.onclose = function() {
                document.getElementById("connection-indicator").classList.replace("bg-emerald-400", "bg-rose-500");
                document.getElementById("status-text").innerText = "منقطع الاتصال";
            };
        }

        function requestData(action) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("الرجاء الاتصال بالخادم أولاً!");
                return;
            }
            const agentID = document.getElementById("agent-id-input").value;
            ws.send(JSON.stringify({
                type: "command",
                target: agentID,
                sender: myID,
                payload: { action: action }
            }));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('bg-emerald-600/20', 'text-emerald-400'));
            event.currentTarget.classList.add('bg-emerald-600/20', 'text-emerald-400');
            
            const panel = document.getElementById("panel-content");
            if (tab === 'files') {
                panel.innerHTML = `<h2 class="text-2xl font-bold mb-4 text-emerald-300">📁 تصفح ملفات الهاتف القديم</h2><p class="text-slate-400">جارٍ جلب الملفات...</p>`;
                requestData("list_files");
            } else if (tab === 'photos') {
                panel.innerHTML = `<h2 class="text-2xl font-bold mb-4 text-emerald-300">🖼️ معرض الصور</h2><div class="grid grid-cols-3 gap-4 mt-4" id="photo-grid"></div>`;
                requestData("list_photos");
            } else if (tab === 'notes') {
                panel.innerHTML = `<h2 class="text-2xl font-bold mb-4 text-emerald-300">📝 الملاحظات والرسائل</h2><p class="text-slate-400">لا توجد ملاحظات محملة.</p>`;
                requestData("get_notes");
            } else if (tab === 'system') {
                panel.innerHTML = `<h2 class="text-2xl font-bold mb-4 text-emerald-300">⚙️ حالة النظام والبطارية</h2><p class="text-slate-400">البطارية: 84% - الشحن: متصل</p>`;
                requestData("get_status");
            }
        }
    </script>
</body>
</html>
